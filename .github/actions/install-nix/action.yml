name: install Nix

inputs:
  cachixAuthToken:
    description: auth token for https://app.cachix.org/organization/rvolosatovs/cache/rvolosatovs

runs:
  using: composite
  steps:
  - uses: DeterminateSystems/nix-installer-action@3138316df39ed29be04236d7ffc686fa525866aa # v23
    with:
      extra-conf: |
        accept-flake-config = true

  - uses: DeterminateSystems/magic-nix-cache-action@908b263ff629f4cc17666315b7fd3ec127c6244d # v14

  - uses: cachix/cachix-action@38b082610b782e7e93e209c35fd730d399dee866 # v17
    continue-on-error: true
    with:
      name: rvolosatovs
      authToken: '${{ inputs.cachixAuthToken }}'
